name: Forum Cache

# Mirror the forum channel (issue #1 comments) into a static JSON file on the
# dedicated "forum-cache" branch. The website reads that file directly from
# raw.githubusercontent.com — anonymous visitors get unlimited reads with NO
# GitHub API rate limit, while posting still goes through the live API.
#
# Committing to a separate branch (not main) means GitHub Pages is not rebuilt
# and the main branch history stays clean.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: forum-cache
  cancel-in-progress: false

jobs:
  cache:
    name: Cache forum comments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch to cache branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --heads origin forum-cache | grep -q "refs/heads/forum-cache"; then
            git fetch origin forum-cache
            git checkout -B forum-cache origin/forum-cache
          else
            git checkout --orphan forum-cache
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Fetch and trim comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE="${{ vars.FORUM_ISSUE || '1' }}"
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE/comments?per_page=100" \
          | python3 -c '
          import sys, json, datetime
          data = json.load(sys.stdin)
          if not isinstance(data, list):
              data = []
          comments = [{
              "id": c.get("id"),
              "created_at": c.get("created_at"),
              "body": c.get("body"),
              "user": {"login": (c.get("user") or {}).get("login"),
                       "avatar_url": (c.get("user") or {}).get("avatar_url")},
          } for c in data]
          old = None
          try:
              old = json.load(open("forum-cache.json"))
          except Exception:
              pass
          if old and old.get("comments") == comments:
              print("No new messages — cache unchanged.")
              sys.exit(0)
          out = {"source": "GitHub Actions forum-cache workflow",
                 "updated_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "comments": comments}
          json.dump(out, open("forum-cache.json", "w"), indent=2)
          print("Cache written:", len(comments), "comments.")
          '

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add forum-cache.json
          if git diff --cached --quiet; then
            echo "No new messages — cache unchanged."
          else
            git commit -m "forum: refresh comment cache (scheduled)"
            git push origin forum-cache
            echo "Cache pushed."
          fi
