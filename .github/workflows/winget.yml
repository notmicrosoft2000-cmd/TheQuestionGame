name: Publish to WinGet

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag to publish (for manual runs)
        required: true
        default: v1.0.0

permissions:
  contents: read

jobs:
  winget:
    runs-on: ubuntu-latest
    steps:
      - name: Submit to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: NeptuneProductions.TheQuestionGame
          installers-regex: TheQuestionGame[.]zip$
          release-tag: ${{ github.event.release.tag_name || github.event.inputs.release-tag }}
          token: ${{ secrets.WINGET_TOKEN }}
