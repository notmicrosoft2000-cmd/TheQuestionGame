name: Publish to WinGet

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  winget:
    runs-on: ubuntu-latest
    steps:
      - name: Submit to winget-pkgs
        uses: vedantmgoyal2009/winget-releaser@latest
        with:
          identifier: NeptuneProductions.TheQuestionGame
          installers-regex: TheQuestionGame[.]zip$
          token: ${{ secrets.WINGET_TOKEN }}
